<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>뇌 건강 운동교실</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2A2340">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="뇌건강교실">
<style>
:root{
  --ink:#2A2340; --purple:#5B4B8A; --aero:#1B6E8C; --str:#2C6E49; --bal:#C2571A;
  --paper:#F6F4FA; --line:#DCD6EC; --gold:#F0B429; --red:#A8241C;
  --s:1;
}
*{box-sizing:border-box;-webkit-text-size-adjust:100%}
html{font-size:calc(20px * var(--s))}
body{margin:0;background:var(--paper);color:#1A1A1A;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);line-height:1.5}

header{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;
  padding:calc(.7rem + env(safe-area-inset-top)) .9rem .7rem;display:flex;align-items:center;gap:.6rem}
.brand{font-size:1.25rem;font-weight:800;flex:1;letter-spacing:-.02em}
.brand span{display:block;font-size:.72rem;font-weight:500;color:#B9AFD6;margin-top:.1rem}
.sizer{display:flex;gap:.35rem}
.sizer button{width:2.5rem;height:2.5rem;border-radius:.7rem;border:0;background:#4A3D73;color:#fff;
  font-size:1.05rem;font-weight:800}

main{padding:1rem .8rem 3rem;max-width:720px;margin:0 auto}
.view{display:none} .view.on{display:block}

h2.sec{font-size:1.5rem;margin:.3rem 0 .2rem;font-weight:800;color:var(--ink)}
.lead{margin:0 0 1rem;color:#5D5370;font-size:1rem}

/* 메뉴 */
.menu{display:grid;gap:.75rem}
.m{display:flex;align-items:center;gap:.85rem;width:100%;border:0;border-radius:1.1rem;
  padding:1.15rem 1rem;color:#fff;text-align:left;font-family:inherit}
.m .ic{flex:0 0 3.2rem;height:3.2rem;border-radius:.9rem;background:rgba(255,255,255,.22);
  display:flex;align-items:center;justify-content:center;font-size:1.5rem}
.m b{display:block;font-size:1.3rem;font-weight:800;letter-spacing:-.02em}
.m small{display:block;font-size:.9rem;opacity:.9;margin-top:.1rem}
.m .go{margin-left:auto;font-size:1.6rem;opacity:.75}
.m.home{background:var(--str)} .m.all{background:var(--purple)} .m.slide{background:#51607A}

/* 상단바 */
.bar{position:sticky;top:0;z-index:15;background:var(--paper);padding:.6rem 0 .7rem;
  display:flex;align-items:center;gap:.7rem;border-bottom:1px solid var(--line);margin-bottom:.9rem}
.back{border:0;background:var(--ink);color:#fff;border-radius:.85rem;padding:.75rem 1.05rem;
  font-size:1.05rem;font-weight:800;font-family:inherit}
.bar b{font-size:1.15rem}

/* 운동 카드 */
.grp{margin:1.4rem 0 .5rem;font-size:1.25rem;font-weight:800;padding-left:.7rem;border-left:.4rem solid var(--purple)}
.grp.a{border-color:var(--aero)} .grp.s{border-color:var(--str)} .grp.b{border-color:var(--bal)}
.card{background:#fff;border:1px solid var(--line);border-radius:1.1rem;overflow:hidden;margin-bottom:1.1rem}
.card img{display:block;width:100%;height:auto;background:#fff}
.tx{padding:.9rem 1rem 1.1rem}
.nm{font-size:1.45rem;font-weight:800;color:var(--ink);letter-spacing:-.02em;line-height:1.3}
.dose{display:inline-block;margin-top:.5rem;padding:.4rem .9rem;border-radius:999px;
  background:var(--purple);color:#fff;font-size:1.05rem;font-weight:800}
.dose.a{background:var(--aero)} .dose.s{background:var(--str)} .dose.b{background:var(--bal)}
.tip{margin-top:.6rem;font-size:1.12rem;color:#3D4A55;line-height:1.55}
.hint{background:#FFF6E2;border-radius:.8rem;padding:.9rem 1rem;font-size:1.05rem;color:#6B4E00;
  font-weight:700;margin:.2rem 0 1.1rem}

/* 슬라이드 */
.slides img{width:100%;height:auto;border-radius:.8rem;border:1px solid var(--line);background:#fff;margin-bottom:.8rem}
.rot{background:#E9E3F4;border-radius:.8rem;padding:.8rem 1rem;color:#4A3D73;font-size:1rem;
  text-align:center;margin-bottom:1rem;font-weight:700}

footer{margin-top:2rem;padding:1.3rem 1rem calc(1.3rem + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);color:#5D5370;font-size:.95rem;text-align:center}
footer .t{display:inline-block;margin-top:.5rem;color:#8A82A0;font-size:.85rem}

.top{position:fixed;left:1rem;bottom:calc(1rem + env(safe-area-inset-bottom));
  width:3.1rem;height:3.1rem;border-radius:50%;border:0;background:var(--ink);color:#fff;
  font-size:1.3rem;box-shadow:0 4px 14px rgba(42,35,64,.35);display:none;z-index:18}

/* 확대 보기 */
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;display:none;
  align-items:center;justify-content:center;padding:env(safe-area-inset-top) .5rem}
#zoom.on{display:flex}
#zoom img{max-width:100%;max-height:100%;object-fit:contain}
#zclose{position:absolute;top:calc(.8rem + env(safe-area-inset-top));right:.9rem;
  width:3rem;height:3rem;border-radius:50%;border:0;background:rgba(255,255,255,.95);
  font-size:1.3rem;font-weight:800;color:#222}

/* 첫 안내 */
#tipbox{position:fixed;left:.8rem;right:.8rem;bottom:calc(1rem + env(safe-area-inset-bottom));
  background:var(--gold);color:#3A2B00;border-radius:1rem;padding:1rem 1.1rem;z-index:40;
  font-size:1.05rem;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.25);display:none}
#tipbox button{margin-top:.7rem;width:100%;border:0;border-radius:.7rem;padding:.75rem;
  background:#3A2B00;color:#fff;font-size:1rem;font-weight:800;font-family:inherit}

@media (orientation:landscape){
  header{padding:.4rem .9rem}
  .brand{font-size:1.02rem} .brand span{display:none}
  main{max-width:none;padding:.7rem 1rem 2rem}
  .card{display:flex;align-items:center;gap:1rem}
  .card img{width:46%;flex:0 0 46%}
  .tx{flex:1}
}
</style>
</head>
<body>

<header>
  <div class="brand">뇌 건강 운동교실<span>양산시보건소 공공재활물리치료교실</span></div>
  <div class="sizer">
    <button onclick="fs(-1)" aria-label="작게">가−</button>
    <button onclick="fs(1)" aria-label="크게">가+</button>
  </div>
</header>

<main>
  <!-- 홈 -->
  <section id="home" class="view on">
    <h2 class="sec">1주차 운동</h2>
    <p class="lead">보고 싶은 것을 눌러주세요</p>
    <div class="menu">
      <button class="m home" onclick="go('hp')">
        <div class="ic">★</div>
        <div><b>집에서 하실 3가지</b><small>매일 하실 운동</small></div>
        <div class="go">›</div>
      </button>
      <button class="m all" onclick="go('all')">
        <div class="ic">▦</div>
        <div><b>오늘 배운 운동 전부</b><small>준비운동부터 머리 쓰는 운동까지</small></div>
        <div class="go">›</div>
      </button>
      <button class="m slide" onclick="go('sl')">
        <div class="ic">▭</div>
        <div><b>수업 화면 다시 보기</b><small>전체 22장</small></div>
        <div class="go">›</div>
      </button>
    </div>
  </section>

  <!-- 집에서 하실 3가지 -->
  <section id="hp" class="view">
    <div class="bar"><button class="back" onclick="go('home')">← 뒤로</button><b>집에서 하실 3가지</b></div>
    <div class="hint">언제 하실지 정하세요 — 아침 드시고 / TV 광고 때 / 자기 전</div>
    <div id="hpList"></div>
  </section>

  <!-- 전체 운동 -->
  <section id="all" class="view">
    <div class="bar"><button class="back" onclick="go('home')">← 뒤로</button><b>오늘 배운 운동</b></div>
    <div id="allList"></div>
  </section>

  <!-- 슬라이드 -->
  <section id="sl" class="view">
    <div class="bar"><button class="back" onclick="go('home')">← 뒤로</button><b>수업 화면</b></div>
    <div class="rot">휴대폰을 옆으로 돌리면 크게 보입니다<br>그림을 누르면 꽉 차게 열립니다</div>
    <div class="slides" id="slList"></div>
  </section>
</main>

<footer>
  양산시 보건소<br>양산제일병원 재활치료팀장 정용진
  <span class="t">글씨가 작으면 오른쪽 위 가+를 눌러주세요</span>
</footer>

<button class="top" id="top" onclick="scrollTo({top:0,behavior:'smooth'})">↑</button>

<div id="zoom" onclick="zclose()"><img id="zimg" alt=""><button id="zclose" onclick="zclose()">✕</button></div>

<div id="tipbox">
  글씨나 그림이 작으면<br>오른쪽 위 <b>가+</b>를 눌러주세요
  <button onclick="hideTip()">알겠습니다</button>
</div>

<script>
var VER = 2;
var EX = {
  hp: [
    {img:"ex/walk1.jpg", nm:"걷기", dose:"하루 10분부터", tip:"말은 되고 노래는 안 되는 속도로", c:"a"},
    {img:"ex/str1.jpg",  nm:"앉았다 일어서기", dose:"10회", tip:"의자에서 · 엉덩이 먼저 뒤로", c:"s"},
    {img:"ex/bal1.jpg",  nm:"두 발 모으고 서기", dose:"30초 × 2회", tip:"싱크대를 잡고 · 설거지하면서", c:"b"}
  ],
  groups: [
    { t:"준비운동", c:"a", items:[
      {img:"ex/warm1.jpg", nm:"제자리 걷기", dose:"2분", tip:"팔을 크게 흔들며 숨이 조금 찰 정도로"},
      {img:"ex/warm2.jpg", nm:"어깨 · 팔 돌리기", dose:"각 10회", tip:"크게, 천천히"},
      {img:"ex/warm3.jpg", nm:"몸통 좌우 돌리기", dose:"각 10회", tip:"엉덩이는 앞을 보고 몸통만 돌리기"},
      {img:"ex/warm4.jpg", nm:"종아리 늘리기", dose:"20초 × 2", tip:"벽을 짚고 뒤꿈치를 바닥에 붙인 채"}
    ]},
    { t:"① 걷기", c:"a", items:[
      {img:"ex/walk1.jpg", nm:"제자리 걷기", dose:"1분", tip:"팔을 가볍게 흔들며 무릎을 가볍게 들고"},
      {img:"ex/walk2.jpg", nm:"무릎 높이 들며 걷기", dose:"1분", tip:"팔을 크게 흔들며 무릎을 허리 높이까지"},
      {img:"ex/walk3.jpg", nm:"앞뒤로 두 걸음씩", dose:"1분", tip:"앞으로 크게 두 걸음, 뒤로는 천천히 두 걸음"}
    ]},
    { t:"② 근육 쓰기", c:"s", items:[
      {img:"ex/str1.jpg", nm:"앉았다 일어서기", dose:"10회 × 2", tip:"엉덩이 먼저 뒤로"},
      {img:"ex/str2.jpg", nm:"무릎 펴기", dose:"좌우 10회", tip:"펴서 3초 버티기"},
      {img:"ex/str3.jpg", nm:"밴드 양옆으로 벌리기", dose:"10회 × 2", tip:"날개뼈를 모으며"},
      {img:"ex/str4.jpg", nm:"뒤꿈치 들기", dose:"10회 × 2", tip:"천천히 내리기"},
      {img:"ex/str5.jpg", nm:"발끝 들기", dose:"10회 × 2", tip:"뒤꿈치는 바닥에"}
    ]},
    { t:"누워서 하고, 그대로 일어나기", c:"s", items:[
      {img:"ex/rise1.jpg", nm:"엉덩이 들어올리기", dose:"10회 × 2", tip:"허리 말고 엉덩이로 들기"},
      {img:"ex/rise2.jpg", nm:"옆으로 돌아눕기", dose:"", tip:"무릎으로 바로 일어서지 마세요"},
      {img:"ex/rise3.jpg", nm:"네 발로 기는 자세", dose:"", tip:"손과 무릎으로 체중 나누기"},
      {img:"ex/rise4.jpg", nm:"짚고 일어서기", dose:"", tip:"한쪽 무릎 세우고 의자 · 벽 짚기"}
    ]},
    { t:"③ 균형 잡기 4단계", c:"b", items:[
      {img:"ex/bal1.jpg", nm:"1단계 · 두 발 모으고 서기", dose:"30초 × 2회", tip:"두 손 잡고 → 한 손만"},
      {img:"ex/bal2.jpg", nm:"2단계 · 일자로 서기", dose:"좌우 30초", tip:"한 발 앞뒤로"},
      {img:"ex/bal3.jpg", nm:"3단계 · 한 발로 서기", dose:"좌우 30초", tip:"의자를 잡고"},
      {img:"ex/bal4.jpg", nm:"4단계 · 푹신한 곳 위에서", dose:"되시는 분만", tip:"방석 위에서 두 발"}
    ]},
    { t:"움직이면서 균형 잡기", c:"b", items:[
      {img:"ex/dyn1.jpg", nm:"앞뒤로 발 딛기", dose:"좌우 10회", tip:"한 발 앞으로 딛고 제자리 · 뒤로 딛고 제자리"},
      {img:"ex/dyn2.jpg", nm:"제자리 걷다가 멈추기", dose:"10회", tip:"'멈추세요' 하면 그 자리에서 정지"},
      {img:"ex/dyn3.jpg", nm:"좌 · 우로 두 걸음 걷기", dose:"좌우 2회", tip:"옆으로 두 걸음, 다시 두 걸음으로 돌아오기"},
      {img:"ex/dyn4.jpg", nm:"일자로 발 바꾸기", dose:"좌우 10회", tip:"의자를 잡고 뒤꿈치를 발가락 끝에 붙여서"}
    ]},
    { t:"④ 머리 쓰는 운동", c:"", items:[
      {img:"ex/cog1.jpg", nm:"박수 따라하기", dose:"", tip:"치는 대로 따라 쳐보세요"},
      {img:"ex/cog2.jpg", nm:"손발 다른 동작", dose:"", tip:"오른손은 무릎 두드리고 왼손은 배 문지르기"},
      {img:"ex/cog3.jpg", nm:"숫자 거꾸로 세기", dose:"", tip:"발을 번갈아 들면서 30부터 거꾸로"},
      {img:"ex/cog4.jpg", nm:"거울 동작", dose:"", tip:"짝꿍과 마주 보고 상대 동작 따라하기"},
      {img:"ex/cog5.jpg", nm:"끝말잇기 걷기", dose:"", tip:"제자리 걸으면서 짝꿍과 끝말잇기"}
    ]}
  ]
};

function card(e, c){
  var cc = c || e.c || "";
  var d = e.dose ? '<span class="dose '+cc+'">'+e.dose+'</span>' : '';
  return '<div class="card">'
       + '<img src="'+e.img+'?v='+VER+'" alt="'+e.nm+'" loading="lazy" onclick="zopen(this.src)">'
       + '<div class="tx"><div class="nm">'+e.nm+'</div>'+d
       + '<div class="tip">'+e.tip+'</div></div></div>';
}
function build(){
  document.getElementById("hpList").innerHTML = EX.hp.map(function(e){return card(e);}).join("");
  var h="";
  EX.groups.forEach(function(g){
    h += '<div class="grp '+g.c+'">'+g.t+'</div>';
    g.items.forEach(function(e){ h += card(e, g.c); });
  });
  document.getElementById("allList").innerHTML = h;
  var s="";
  for(var i=1;i<=22;i++){
    var n = i<10 ? "0"+i : ""+i;
    s += '<img src="img/w1-'+n+'.jpg?v='+VER+'" alt="'+i+'" loading="lazy" onclick="zopen(this.src)">';
  }
  document.getElementById("slList").innerHTML = s;
}
var VIEWS = { home:1, hp:1, all:1, sl:1 };
var came = false;
function show(id){
  document.querySelectorAll(".view").forEach(function(v){ v.classList.remove("on"); });
  document.getElementById(id).classList.add("on");
  scrollTo(0,0);
}
function go(id){
  if(id === "home"){
    if(came){ came = false; history.back(); }
    else { history.replaceState(null, "", location.pathname); show("home"); }
  } else { came = true; location.hash = id; }
}
function route(){
  var h = location.hash.replace("#","");
  if(h === "zoom") return;
  show(VIEWS[h] ? h : "home");
}
addEventListener("hashchange", function(){
  var z = document.getElementById("zoom");
  if(z.classList.contains("on") && location.hash !== "#zoom"){ z.classList.remove("on"); return; }
  route();
});
function zopen(src){
  document.getElementById("zimg").src = src;
  document.getElementById("zoom").classList.add("on");
  location.hash = "zoom";
}
function zclose(){
  if(location.hash === "#zoom") history.back();
  else document.getElementById("zoom").classList.remove("on");
}

var s = 1;
try { s = parseFloat(localStorage.getItem("bs")) || 1; } catch(e){}
function apply(){ document.documentElement.style.setProperty("--s", s); }
function fs(d){ s = Math.min(1.7, Math.max(0.85, +(s + d*0.15).toFixed(2))); apply();
  try { localStorage.setItem("bs", s); } catch(e){} }
apply();

function hideTip(){ document.getElementById("tipbox").style.display="none";
  try { localStorage.setItem("bt","1"); } catch(e){} }
try { if(!localStorage.getItem("bt")) setTimeout(function(){
  document.getElementById("tipbox").style.display="block"; }, 900); } catch(e){}

addEventListener("scroll", function(){
  document.getElementById("top").style.display = scrollY > 600 ? "block" : "none";
});
build();
route();
</script>
</body>
</html>
